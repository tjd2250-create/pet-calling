<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>우리 아이 전화 왔어요 🐾</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f2f2f7;font-family:-apple-system,"Helvetica Neue",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 48px}
  h1{font-size:22px;font-weight:600;color:#1c1c1e;margin-bottom:4px;text-align:center}
  .sub{font-size:14px;color:#8e8e93;margin-bottom:28px;text-align:center}
  .card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
  .upload-zone{border:1.5px dashed #c7c7cc;border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;background:#f9f9fb;position:relative;transition:background 0.15s}
  .upload-zone:hover{background:#f2f2f7}
  .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .upload-icon{font-size:36px;margin-bottom:8px}
  .upload-text{font-size:14px;color:#8e8e93}
  .thumb-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #e5e5ea;margin:0 auto 8px;display:block}
  .section-label{font-size:13px;font-weight:500;color:#8e8e93;margin:20px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
  .name-input{width:100%;padding:13px 16px;font-size:17px;border-radius:12px;border:1.5px solid #e5e5ea;background:#f9f9fb;color:#1c1c1e;outline:none;transition:border-color 0.15s}
  .name-input:focus{border-color:#007aff}
  .gen-btn{margin-top:20px;width:100%;padding:15px;font-size:17px;font-weight:600;border-radius:14px;border:none;background:#007aff;color:#fff;cursor:pointer;transition:opacity 0.15s}
  .gen-btn:disabled{background:#c7c7cc;cursor:not-allowed}
  .gen-btn:not(:disabled):active{opacity:0.8}
  .result-section{margin-top:28px;text-align:center;display:none}
  .result-section.show{display:block}
  .result-label{font-size:13px;font-weight:500;color:#8e8e93;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
  .result-img{width:100%;max-width:280px;border-radius:8px;display:block;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
  .dl-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:13px 28px;font-size:16px;font-weight:600;border-radius:14px;border:none;background:#34c759;color:#fff;cursor:pointer;}
  .tip{font-size:12px;color:#8e8e93;margin-top:10px}
</style>
</head>
<body>
<h1>🐾 우리 아이 전화 왔어요</h1>
<p class="sub">사진이랑 이름만 넣으면 끝!</p>
<div class="card">
  <div class="upload-zone" id="zone">
    <input type="file" accept="image/*" id="fileInput">
    <div class="upload-icon">📷</div>
    <p class="upload-text" id="zoneText">사진을 눌러서 올리세요</p>
  </div>
  <p class="section-label">이름</p>
  <input class="name-input" type="text" id="nameInput" placeholder="예: 송이" maxlength="20">
  <button class="gen-btn" id="genBtn" disabled>이미지 만들기</button>
  <div class="result-section" id="resultSection">
    <p class="result-label">완성!</p>
    <img id="resultImg" class="result-img" alt="생성된 전화 수신 화면">
    <br>
    <button class="dl-btn" id="dlBtn">⬇️ 저장하기</button>
    <p class="tip">이미지를 꾹 눌러서 저장할 수도 있어요</p>
  </div>
</div>

const fileInput=document.getElementById('fileInput');
const nameInput=document.getElementById('nameInput');
const genBtn=document.getElementById('genBtn');
const dlBtn=document.getElementById('dlBtn');
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
const resultImg=document.getElementById('resultImg');
const resultSection=document.getElementById('resultSection');
const zoneText=document.getElementById('zoneText');
const zone=document.getElementById('zone');

const W=1179,H=2556;
cvs.width=W;cvs.height=H;

let petImg=null;
const uiImg=new Image();
uiImg.src=UI_B64;

function checkReady(){genBtn.disabled=!(petImg&&nameInput.value.trim());}

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      petImg=img;
      let old=zone.querySelector('.thumb-preview');if(old)old.remove();
      const thumb=document.createElement('img');
      thumb.src=ev.target.result;thumb.className='thumb-preview';
      zone.insertBefore(thumb,zone.querySelector('.upload-icon'));
      zoneText.textContent='사진 선택됨 ✓';checkReady();
    };img.src=ev.target.result;
  };reader.readAsDataURL(file);
});

nameInput.addEventListener('input',checkReady);

function stackBlur(ctx,w,h,radius){
  const imgData=ctx.getImageData(0,0,w,h);
  const d=imgData.data;
  const wm=w-1,hm=h-1;
  const rad1=radius+1;
  let rsum,gsum,bsum,x,y,i,yp,yi,yw;
  const vmin=new Int32Array(Math.max(w,h));
  const r=new Uint8ClampedArray(w*h),g=new Uint8ClampedArray(w*h),b=new Uint8ClampedArray(w*h);
  const dv=new Uint8ClampedArray(256*rad1);
  for(i=0;i<256*rad1;i++)dv[i]=Math.round(i/rad1);
  yw=yi=0;
  for(y=0;y<h;y++){
    rsum=gsum=bsum=0;
    for(i=-radius;i<=radius;i++){
      const p=(yi+Math.min(wm,Math.max(0,i)))*4;
      rsum+=d[p];gsum+=d[p+1];bsum+=d[p+2];
    }
    for(x=0;x<w;x++){
      r[yi]=dv[rsum];g[yi]=dv[gsum];b[yi]=dv[bsum];
      if(y===0)vmin[x]=Math.min(x+rad1,wm);
      const p1=(yw+vmin[x])*4;
      if(y===0)vmin[x]=Math.max(x-radius,0);
      const p2=(yw+vmin[x])*4;
      rsum+=d[p1]-d[p2];gsum+=d[p1+1]-d[p2+1];bsum+=d[p1+2]-d[p2+2];
      yi++;
    }
    yw+=w;
  }
  for(x=0;x<w;x++){
    rsum=gsum=bsum=0;yp=-radius*w;
    for(i=-radius;i<=radius;i++){
      yi=Math.max(0,yp)+x;
      rsum+=r[yi];gsum+=g[yi];bsum+=b[yi];yp+=w;
    }
    yi=x;
    for(y=0;y<h;y++){
      d[yi*4]=dv[rsum];d[yi*4+1]=dv[gsum];d[yi*4+2]=dv[bsum];
      if(x===0)vmin[y]=Math.min(y+rad1,hm)*w;
      const p1=x+vmin[y];
      if(x===0)vmin[y]=Math.max(y-radius,0)*w;
      const p2=x+vmin[y];
      rsum+=r[p1]-r[p2];gsum+=g[p1]-g[p2];bsum+=b[p1]-b[p2];
      yi+=w;
    }
  }
  ctx.putImageData(imgData,0,0);
}

genBtn.addEventListener('click',()=>{
  const name=nameInput.value.trim();
  ctx.clearRect(0,0,W,H);

  // 레이어1: 배경 #232223
  ctx.fillStyle='#232223';
  ctx.fillRect(0,0,W,H);

  // 레이어2: 블러 이미지 세로 꽉차게 투명도 10%
  const sc=Math.max(W/petImg.width,H/petImg.height);
  const bw=petImg.width*sc,bh=petImg.height*sc;
  ctx.drawImage(petImg,(W-bw)/2,(H-bh)/2,bw,bh);
  stackBlur(ctx,W,H,40);
  // 투명도 10% 효과: 배경 다시 덮고 이미지 10%로
  const blurData=ctx.getImageData(0,0,W,H);
  ctx.fillStyle='#232223';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.10;
  const tmpCvs=document.createElement('canvas');tmpCvs.width=W;tmpCvs.height=H;
  const tmpCtx=tmpCvs.getContext('2d');tmpCtx.putImageData(blurData,0,0);
  ctx.drawImage(tmpCvs,0,0);
  ctx.globalAlpha=1.0;

  // 레이어3: 원형 아바타 — 화면 중앙 위쪽
  const r=310,cx=W/2,cy=H*0.36;
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  const as=Math.max((r*2)/petImg.width,(r*2)/petImg.height);
  const aw=petImg.width*as,ah=petImg.height*as;
  ctx.drawImage(petImg,cx-aw/2,cy-ah/2,aw,ah);
  ctx.restore();

  // 레이어4: UI 이미지 전체
  ctx.drawImage(uiImg,0,0,W,H);

  // 이름 텍스트
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff';
  ctx.font='300 130px -apple-system,"SF Pro Display","Helvetica Neue",sans-serif';
  ctx.fillText(name,W/2,320);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='300 58px -apple-system,"Helvetica Neue",sans-serif';
  ctx.fillText('is calling...',W/2,410);

  const url=cvs.toDataURL('image/png');
  resultImg.src=url;
  resultSection.classList.add('show');
  dlBtn.onclick=()=>{
    const a=document.createElement('a');
    a.href=url;a.download=name+'_calling.png';a.click();
  };
});
</script>
</body>
</html>
