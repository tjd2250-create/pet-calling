<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나도 만들기 🐾</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2f2f7;font-family:-apple-system,"Helvetica Neue",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 48px}
h1{font-size:22px;font-weight:700;color:#1c1c1e;margin-bottom:4px;text-align:center;line-height:1.4}
.sub{font-size:14px;color:#8e8e93;margin-bottom:28px;text-align:center}
.card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:20px}
.upload-zone{border:1.5px dashed #c7c7cc;border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;background:#f9f9fb;position:relative;transition:background 0.15s}
.upload-zone:hover{background:#f2f2f7}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:36px;margin-bottom:8px}
.upload-text{font-size:14px;color:#8e8e93}
.thumb-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #e5e5ea;margin:0 auto 8px;display:block}
.section-label{font-size:13px;font-weight:500;color:#8e8e93;margin:20px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
.name-input{width:100%;padding:13px 16px;font-size:17px;border-radius:12px;border:1.5px solid #e5e5ea;background:#f9f9fb;color:#1c1c1e;outline:none;transition:border-color 0.15s}
.name-input:focus{border-color:#007aff}
.gen-btn{margin-top:20px;width:100%;padding:15px;font-size:17px;font-weight:600;border-radius:14px;border:none;background:#007aff;color:#fff;cursor:pointer;transition:opacity 0.15s}
.gen-btn:disabled{background:#c7c7cc;cursor:not-allowed}
.gen-btn:not(:disabled):active{opacity:0.8}
.generating{margin-top:16px;text-align:center;font-size:14px;color:#8e8e93;display:none}
.result-section{margin-top:28px;text-align:center;display:none}
.result-section.show{display:block}
.result-label{font-size:13px;font-weight:500;color:#8e8e93;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.result-img{width:100%;max-width:280px;border-radius:8px;display:block;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.dl-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:13px 28px;font-size:16px;font-weight:600;border-radius:14px;border:none;background:#34c759;color:#fff;cursor:pointer}
.dl-btn:active{opacity:0.8}
.tip{font-size:12px;color:#8e8e93;margin-top:10px}
#pwWrap{position:fixed;bottom:20px;right:20px;z-index:999}
#pwInput{width:80px;padding:6px 10px;font-size:13px;border-radius:8px;border:1px solid #c7c7cc;background:rgba(255,255,255,0.9);color:#1c1c1e;outline:none;text-align:center}
</style>
</head>
<body>
<h1>송이한테 전화왔어요<br>나도 만들기 🐾</h1>
<p class="sub">사진이랑 이름만 넣으면 끝!</p>

<div class="card">
  <div class="upload-zone" id="zone">
    <input type="file" accept="image/*" id="fileInput">
    <div class="upload-icon">📷</div>
    <p class="upload-text" id="zoneText">사진을 눌러서 올리세요</p>
  </div>
  <p class="section-label">이름</p>
  <input class="name-input" type="text" id="nameInput" placeholder="예: 송이" maxlength="20">
  <button class="gen-btn" id="genBtn" disabled>이미지 만들기</button>
  <p class="generating" id="generating">생성 중... 잠깐만요 ⏳</p>
  <div class="result-section" id="resultSection">
    <p class="result-label">완성!</p>
    <img id="resultImg" class="result-img" alt="생성된 전화 수신 화면">
    <br>
    <button class="dl-btn" id="dlBtn">⬇️ 저장하기</button>
    <p class="tip">이미지를 꾹 눌러서 저장할 수도 있어요</p>
  </div>
</div>

<div id="pwWrap">
  <input type="password" id="pwInput" placeholder="••••" maxlength="10">
</div>

<canvas id="cvs" style="display:none"></canvas>
<canvas id="thumbCvs" style="display:none"></canvas>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA const W = 1179, H = 2556;
const NAME_Y = 415;
const AVATAR_CY_RATIO = 0.43;
const AVATAR_R = 310;

const fileInput = document.getElementById('fileInput');
const nameInput = document.getElementById('nameInput');
const genBtn = document.getElementById('genBtn');
const dlBtn = document.getElementById('dlBtn');
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const thumbCvs = document.getElementById('thumbCvs');
const thumbCtx = thumbCvs.getContext('2d');
const resultImg = document.getElementById('resultImg');
const resultSection = document.getElementById('resultSection');
const zoneText = document.getElementById('zoneText');
const zone = document.getElementById('zone');
const generating = document.getElementById('generating');
const pwInput = document.getElementById('pwInput');

cvs.width = W; cvs.height = H;
// 메일용 썸네일 캔버스: 200x433 (비율 유지, 50KB 이하)
const TW = 200, TH = 433;
thumbCvs.width = TW; thumbCvs.height = TH;

let petImg = null;

const uiRaw = new Image();
uiRaw.src = UI_B64;
let uiCanvas = null;
uiRaw.onload = () => {
  const uc = document.createElement('canvas');
  uc.width = W; uc.height = H;
  const uctx = uc.getContext('2d');
  uctx.drawImage(uiRaw, 0, 0, W, H);
  const id = uctx.getImageData(0, 0, W, H);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i]+d[i+1]+d[i+2] < 30) d[i+3] = 0;
  }
  uctx.putImageData(id, 0, 0);
  uiCanvas = uc;
};

// UI 썸네일 캔버스 (메일용)
const uiThumbRaw = new Image();
uiThumbRaw.src = UI_B64;
let uiThumbCanvas = null;
uiThumbRaw.onload = () => {
  const uc = document.createElement('canvas');
  uc.width = TW; uc.height = TH;
  const uctx = uc.getContext('2d');
  uctx.drawImage(uiThumbRaw, 0, 0, TW, TH);
  const id = uctx.getImageData(0, 0, TW, TH);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i]+d[i+1]+d[i+2] < 30) d[i+3] = 0;
  }
  uctx.putImageData(id, 0, 0);
  uiThumbCanvas = uc;
};

function checkReady() {
  genBtn.disabled = !(petImg && nameInput.value.trim());
}

fileInput.addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      petImg = img;
      let old = zone.querySelector('.thumb-preview'); if (old) old.remove();
      const thumb = document.createElement('img');
      thumb.src = ev.target.result; thumb.className = 'thumb-preview';
      zone.insertBefore(thumb, zone.querySelector('.upload-icon'));
      zoneText.textContent = '사진 선택됨 ✓';
      checkReady();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

nameInput.addEventListener('input', checkReady);

pwInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (pwInput.value === '5858') {
      pwInput.style.display = 'none';
    } else {
      pwInput.value = '';
    }
  }
});

function drawScreen(c, ct, w, h, nameY, avatarCyRatio, avatarR, uiCvs) {
  const name = nameInput.value.trim();
  ct.clearRect(0, 0, w, h);
  ct.fillStyle = '#232223';
  ct.fillRect(0, 0, w, h);

  const sc = Math.max(w/petImg.width, h/petImg.height);
  const bw = petImg.width*sc, bh = petImg.height*sc;
  ct.save();
  ct.filter = 'blur(' + Math.round(40*w/W) + 'px)';
  ct.globalAlpha = 0.10;
  ct.drawImage(petImg, (w-bw)/2, (h-bh)/2, bw, bh);
  ct.restore();

  const r = avatarR;
  const cx2 = w/2, cy2 = h*avatarCyRatio;
  ct.save();
  ct.beginPath();
  ct.arc(cx2, cy2, r, 0, Math.PI*2);
  ct.clip();
  const as = Math.max(r*2/petImg.width, r*2/petImg.height);
  ct.drawImage(petImg, cx2-petImg.width*as/2, cy2-petImg.height*as/2, petImg.width*as, petImg.height*as);
  ct.restore();
  ct.strokeStyle = 'rgba(255,255,255,0.25)';
  ct.lineWidth = Math.max(2, 5*w/W);
  ct.beginPath(); ct.arc(cx2, cy2, r, 0, Math.PI*2); ct.stroke();

  ct.drawImage(uiCvs, 0, 0, w, h);

  ct.fillStyle = '#ffffff';
  ct.textAlign = 'center';
  ct.font = '300 ' + Math.round(130*w/W) + 'px -apple-system,"Helvetica Neue",sans-serif';
  ct.fillText(name, w/2, nameY);
}

genBtn.addEventListener('click', () => {
  if (!petImg || !uiCanvas) return;
  const name = nameInput.value.trim();
  genBtn.disabled = true;
  generating.style.display = 'block';
  resultSection.classList.remove('show');

  setTimeout(async () => {
    // 풀해상도 (다운로드용)
    drawScreen(cvs, ctx, W, H, NAME_Y, AVATAR_CY_RATIO, AVATAR_R, uiCanvas);
    const fullUrl = cvs.toDataURL('image/png');

    // 썸네일 (메일용) - JPEG 품질 70
    const thumbNameY = Math.round(NAME_Y * TW/W);
    const thumbR = Math.round(AVATAR_R * TW/W);
    drawScreen(thumbCvs, thumbCtx, TW, TH, thumbNameY, AVATAR_CY_RATIO, thumbR, uiThumbCanvas || uiCanvas);
    const thumbUrl = thumbCvs.toDataURL('image/jpeg', 0.70);
    console.log('thumb size:', Math.round(thumbUrl.length/1024) + 'KB');

    resultImg.src = fullUrl;
    resultSection.classList.add('show');
    generating.style.display = 'none';
    genBtn.disabled = false;

    dlBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = fullUrl; a.download = name+'_calling.png'; a.click();
    };

    const time = new Date().toLocaleString('ko-KR');
    try {
      await emailjs.send('yoon99', 'template_za4a8c6', {
        name: name,
        time: time,
        image: thumbUrl
      });
      console.log('메일 전송 성공');
    } catch(e) {
      console.log('email error:', e);
    }
  }, 100);
});
</script>
