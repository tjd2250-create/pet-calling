<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>우리 아이 전화 왔어요 🐾</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2f2f7;font-family:-apple-system,"Helvetica Neue",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 48px}
h1{font-size:22px;font-weight:600;color:#1c1c1e;margin-bottom:4px;text-align:center}
.sub{font-size:14px;color:#8e8e93;margin-bottom:28px;text-align:center}
.card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.upload-zone{border:1.5px dashed #c7c7cc;border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;background:#f9f9fb;position:relative}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-text{font-size:14px;color:#8e8e93;margin-top:8px}
.thumb-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #e5e5ea;margin:0 auto 8px;display:block}
.section-label{font-size:13px;font-weight:500;color:#8e8e93;margin:20px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
.name-input{width:100%;padding:13px 16px;font-size:17px;border-radius:12px;border:1.5px solid #e5e5ea;background:#f9f9fb;color:#1c1c1e;outline:none}
.name-input:focus{border-color:#007aff}
.gen-btn{margin-top:20px;width:100%;padding:15px;font-size:17px;font-weight:600;border-radius:14px;border:none;background:#007aff;color:#fff;cursor:pointer}
.gen-btn:disabled{background:#c7c7cc;cursor:not-allowed}
.result-section{margin-top:28px;text-align:center;display:none}
.result-section.show{display:block}
.result-label{font-size:13px;font-weight:500;color:#8e8e93;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.result-img{width:100%;max-width:280px;border-radius:8px;display:block;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.dl-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:13px 28px;font-size:16px;font-weight:600;border-radius:14px;border:none;background:#34c759;color:#fff;cursor:pointer}
.tip{font-size:12px;color:#8e8e93;margin-top:10px}

/* 합성용 스테이지 - 화면 밖에 숨김 */
#stage{
  position:absolute;
  left:-9999px;top:-9999px;
  width:390px;height:844px;
  overflow:hidden;
  background:#232223;
}
#stage .bg-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  filter:blur(40px);
  opacity:0.10;
  transform:scale(1.08);
}
#stage .avatar{
  position:absolute;
  left:50%;top:36%;
  transform:translate(-50%,-50%);
  width:168px;height:168px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid rgba(255,255,255,0.25);
}
#stage .avatar img{
  width:100%;height:100%;object-fit:cover;
}
#stage .ui-overlay{
  position:absolute;inset:0;
  width:100%;height:100%;
}
#stage .name-text{
  position:absolute;
  top:112px;left:0;right:0;
  text-align:center;
  color:#fff;
  font-family:-apple-system,"Helvetica Neue",sans-serif;
  font-size:46px;
  font-weight:300;
  letter-spacing:-0.5px;
}
#stage .calling-text{
  position:absolute;
  top:168px;left:0;right:0;
  text-align:center;
  color:rgba(255,255,255,0.6);
  font-family:-apple-system,"Helvetica Neue",sans-serif;
  font-size:20px;
  font-weight:300;
}
</style>
</head>
<body>
<h1>🐾 우리 아이 전화 왔어요</h1>
<p class="sub">사진이랑 이름만 넣으면 끝!</p>
<div class="card">
  <div class="upload-zone" id="zone">
    <input type="file" accept="image/*" id="fileInput">
    <div style="font-size:36px">📷</div>
    <p class="upload-text" id="zoneText">사진을 눌러서 올리세요</p>
  </div>
  <p class="section-label">이름</p>
  <input class="name-input" type="text" id="nameInput" placeholder="예: 송이" maxlength="20">
  <button class="gen-btn" id="genBtn" disabled>이미지 만들기</button>
  <div class="result-section" id="resultSection">
    <p class="result-label">완성!</p>
    <img id="resultImg" class="result-img" alt="생성된 전화 수신 화면">
    <br>
    <button class="dl-btn" id="dlBtn">⬇️ 저장하기</button>
    <p class="tip">이미지를 꾹 눌러서 저장할 수도 있어요</p>
  </div>
</div>

<canvas id="cvs" style="display:none" width="390" height="844"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const fileInput=document.getElementById('fileInput');
const nameInput=document.getElementById('nameInput');
const genBtn=document.getElementById('genBtn');
const dlBtn=document.getElementById('dlBtn');
const resultImg=document.getElementById('resultImg');
const resultSection=document.getElementById('resultSection');
const zoneText=document.getElementById('zoneText');
const zone=document.getElementById('zone');
const stageBg=document.getElementById('stageBg');
const stageAvatar=document.getElementById('stageAvatar');
const stageName=document.getElementById('stageName');

let petDataUrl=null;

function checkReady(){genBtn.disabled=!(petDataUrl&&nameInput.value.trim());}

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    petDataUrl=ev.target.result;
    let old=zone.querySelector('.thumb-preview');if(old)old.remove();
    const thumb=document.createElement('img');
    thumb.src=petDataUrl;thumb.className='thumb-preview';
    zone.insertBefore(thumb,zone.querySelector('div'));
    zoneText.textContent='사진 선택됨 ✓';
    checkReady();
  };
  reader.readAsDataURL(file);
});

nameInput.addEventListener('input',checkReady);

genBtn.addEventListener('click',async()=>{
  const name=nameInput.value.trim();
  genBtn.disabled=true;
  genBtn.textContent='생성 중...';

  stageBg.src=petDataUrl;
  stageAvatar.src=petDataUrl;
  stageName.textContent=name;

  await new Promise(r=>setTimeout(r,300));

  const stage=document.getElementById('stage');
  const canvas=await html2canvas(stage,{
    width:390,height:844,
    scale:1,
    useCORS:true,
    allowTaint:true,
    backgroundColor:'#232223',
    logging:false
  });

  const url=canvas.toDataURL('image/png');
  resultImg.src=url;
  resultSection.classList.add('show');

  dlBtn.onclick=()=>{
    const a=document.createElement('a');
    a.href=url;a.download=name+'_calling.png';a.click();
  };

  genBtn.disabled=false;
  genBtn.textContent='이미지 만들기';
});
</script>
